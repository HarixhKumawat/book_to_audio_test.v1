[project]
name = "storyaudio"
version = "0.3.0"
description = "Turn EPUB, PDF or TXT books into narrated MP3 audiobooks with Fish Audio Drama 3."
requires-python = ">=3.11"
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
storyaudio = "storyaudio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["storyaudio*"]

[tool.setuptools.package-data]
"storyaudio.studio" = ["page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
